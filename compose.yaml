services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: local-learning-only
      POSTGRES_DB: idempotency
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d idempotency"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
